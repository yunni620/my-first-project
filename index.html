        <form id="task-form" class="task-form">
          <label class="sr-only" for="task-input">输入学习任务</label>
          <input
            id="task-input"
            type="text"
            placeholder="例如：复习 30 分钟英语单词"
            autocomplete="off"
            maxlength="80"
            required
          />
          <button type="submit">添加任务</button>

        <ul id="task-list" class="task-list" aria-live="polite"></ul>
